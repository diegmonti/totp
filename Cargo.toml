[package]
name = "totp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "TOTP CLI using native secure credential storage"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
zeroize = { version = "1.8", features = ["derive", "serde"] }
thiserror = "2"
data-encoding = "2.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
crossterm = "0.29"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { path = "vendor/secret-service", default-features = false, features = ["rt-tokio-crypto-rust"] }
tokio = { version = "1", features = ["rt", "time"] }
