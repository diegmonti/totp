name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  targets:
    needs: checks
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select release platforms
        id: select
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: python
        run: |
          import json
          import os

          targets = [
              {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu"},
              {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"},
              {"os": "windows-2022", "target": "x86_64-pc-windows-msvc"},
          ]
          credentials = (
              "CERTIFICATE_BASE64", "CERTIFICATE_PASSWORD", "SIGNING_IDENTITY",
              "APPLE_ID", "APPLE_TEAM_ID", "APPLE_APP_PASSWORD",
          )
          if all(os.environ.get(key, "").strip() for key in credentials):
              targets.extend([
                  {"os": "macos-15-intel", "target": "x86_64-apple-darwin"},
                  {"os": "macos-15", "target": "aarch64-apple-darwin"},
              ])
          else:
              print("::notice::macOS archives omitted: signing/notarization credentials are incomplete. macOS users can build from source.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": targets}) + "\n")
  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - name: Verify tag version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Sign and notarize macOS executable
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?missing Developer ID certificate}" "${CERTIFICATE_PASSWORD:?missing certificate password}" "${SIGNING_IDENTITY:?missing stable identity}"
          : "${APPLE_ID:?missing Apple ID}" "${APPLE_TEAM_ID:?missing team ID}" "${APPLE_APP_PASSWORD:?missing notarization password}"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          cert="$RUNNER_TEMP/signing.p12"
          trap 'rm -f "$cert"; security delete-keychain "$keychain"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$keychain"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          binary="target/${{ matrix.target }}/release/totp"
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          ditto -c -k "$binary" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/notarization.json"
          python3 -c 'import json,sys; result=json.load(open(sys.argv[1])); sys.exit(0 if result.get("status") == "Accepted" else "notarization was not Accepted")' "$RUNNER_TEMP/notarization.json"
          # Raw command line executables cannot carry a stapled notarization ticket.
      - name: Archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          name="totp-$GITHUB_REF_NAME-$TARGET"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/$TARGET/release/totp.exe" totp.exe
            7z a "dist/$name.zip" totp.exe README.md LICENSE
          else
            tar -czf "dist/$name.tar.gz" -C "target/$TARGET/release" totp -C "$GITHUB_WORKSPACE" README.md LICENSE
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          notes="$RUNNER_TEMP/release-notes.md"
          if compgen -G '*apple-darwin.tar.gz' > /dev/null; then
            printf '%s\n' 'Includes signed and notarized macOS binaries.' > "$notes"
          else
            printf '%s\n' 'macOS binaries are not included in this release. Build from source with stable Rust: `cargo build --release --locked`. See README.md and docs/platforms.md for Keychain authorization guidance.' > "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --generate-notes --notes-file "$notes" --title "$GITHUB_REF_NAME"
